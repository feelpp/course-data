<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Four applications: identify the independent unit</title>
<desc id="desc">Original teaching schematics, not research measurements. Buildings connect energy to area; patient timelines separate observation from prediction; microscopy tracks become a density; electrical and cooling series align in time.</desc>
<rect width="1100" height="600" fill="#f1f5f9"/>
<g font-family="Arial, sans-serif" fill="#16324f">
<text x="32" y="38" font-size="24" font-weight="bold">What does one observation represent?</text>
<g transform="translate(25,60)">
<rect width="515" height="240" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="22" y="35" font-size="22" font-weight="bold">Ktirio · building</text>
<path d="M30 168V103H90V168 M115 168V77H200V168" fill="#dbeafe" stroke="#235d88" stroke-width="3"/>
<path d="M42 118H77 M42 137H77 M130 95H184 M130 119H184 M130 143H184" stroke="#235d88" stroke-width="5"/>
<path d="M224 124H272l-12-9m12 9-12 9" fill="none" stroke="#16324f" stroke-width="3"/>
<text x="292" y="103" font-size="18">building ID</text><text x="292" y="133" font-size="18">energy [kWh]</text><text x="292" y="163" font-size="18">floor area [m²]</text>
<text x="22" y="213" font-size="16">Keys → units → weights → district comparison</text>
</g>
<g transform="translate(560,60)">
<rect width="515" height="240" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="22" y="35" font-size="22" font-weight="bold">Sepsis · patient</text>
<rect x="40" y="74" width="245" height="88" fill="#dcfce7"/><rect x="288" y="74" width="180" height="88" fill="#ffedd5"/>
<path d="M40 150H467 M288 62V175" stroke="#16324f" stroke-width="2"/>
<g fill="#16705d"><circle cx="64" cy="129" r="6"/><circle cx="112" cy="101" r="6"/><circle cx="181" cy="121" r="6"/><circle cx="259" cy="93" r="6"/></g>
<text x="54" y="190" font-size="15">observed past</text><text x="312" y="111" font-size="16">future outcome</text><text x="265" y="58" font-size="14">predict</text>
<text x="22" y="213" font-size="16">Availability → missingness → patient split</text>
</g>
<g transform="translate(25,325)">
<rect width="515" height="240" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="22" y="35" font-size="22" font-weight="bold">Organ on Chip · experiment</text>
<rect x="35" y="66" width="130" height="110" rx="5" fill="#f3e8ff" stroke="#8750a3"/>
<path d="M56 143l18-16 22-12 25-22 M78 154l20-16 25-7 25-19" fill="none" stroke="#8750a3" stroke-width="3"/>
<g fill="#8750a3"><circle cx="56" cy="143" r="4"/><circle cx="96" cy="115" r="4"/><circle cx="121" cy="93" r="4"/></g>
<path d="M193 124H245l-12-9m12 9-12 9" fill="none" stroke="#16324f" stroke-width="3"/>
<text x="273" y="94" font-size="18">position [µm]</text><text x="273" y="126" font-size="18">velocity [µm/s]</text><text x="273" y="158" font-size="18">density / flux</text>
<text x="22" y="213" font-size="16">Calibration → tracking → model observable</text>
</g>
<g transform="translate(560,325)">
<rect width="515" height="240" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="22" y="35" font-size="22" font-weight="bold">JNL-G / LNCMI · operating run</text>
<path d="M45 60V173H466" fill="none" stroke="#16324f" stroke-width="2"/>
<path d="M49 149H132L176 93H293L321 144H460" fill="none" stroke="#235d88" stroke-width="4"/>
<path d="M49 155H154L201 117H315L349 155H460" fill="none" stroke="#bf6516" stroke-width="3" stroke-dasharray="9 5"/>
<text x="63" y="80" font-size="15" fill="#235d88">power</text><text x="348" y="95" font-size="15" fill="#9a4b0a">cooling</text><text x="370" y="193" font-size="14">shared time</text>
<text x="22" y="213" font-size="16">Time alignment → units → operating regime</text>
</g>
<text x="30" y="588" font-size="14">Teaching schematics • choose the unit, then the transformation, then the claim.</text>
</g></svg>