name: course-data
title: Data Processing and Mining
version: ~
start_page: index.adoc
nav:
  - modules/ROOT/nav.adoc
asciidoc:
  attributes:
    project_name: Data Processing and Mining
    project_version: 2026-2027
    python: Python
    cpp: C++
ext:
  collector:
    - run:
        command: uv run python tools/generate_notebooks.py --mode student --output-dir build/notebooks/student
      scan:
        dir: build/notebooks/student
        files: '**/*.ipynb'
        base: modules/ROOT/attachments/notebooks
    - scan:
        dir: datasets/teaching
        files: '**/*'
        base: modules/ROOT/attachments/datasets
    - scan:
        dir: templates
        files: '**/*'
        base: modules/ROOT/attachments/templates
    - scan:
        dir: node_modules/katex/dist
        files: '**/*'
        base: modules/ROOT/attachments/vendor/katex
