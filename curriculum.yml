    title: AI4I 2020 Predictive Maintenance
    doi: 10.24432/C5HS5C
    licence: CC-BY-4.0
  multiclass_reserve:
    id: uci-602
    title: Dry Bean
    doi: 10.24432/C50S4B
    licence: CC-BY-4.0
  synthetic_oracles:
    id: synthetic-oracles
    generated: true
    versioned: true

diagnostic:
  duration_minutes: 35
  completion_deadline: Before Block 2
  mastery_threshold_percent: 75
  domains:
    - id: DG-ENV
      title: Environment and reproducible execution
      concepts: [DP-REP-01]
      minimum_percent: 100
      route: environment
    - id: DG-PY
      title: Core Python
      concepts: [DP-ARR-01]
      minimum_percent: 70
      route: python
    - id: DG-ARR
      title: NumPy arrays and vectorisation
      concepts: [DP-ARR-01]
      minimum_percent: 70
      route: arrays
    - id: DG-TAB
      title: Tabular reasoning
      concepts: [DP-TAB-01, DP-TAB-02]
      minimum_percent: 70
      route: tables
    - id: DG-MATH
      title: Mathematical notation and quantitative reasoning
      concepts: [DP-FND-01]
      minimum_percent: 70
      route: mathematics
  routes:
    environment:
      expected_minutes: 45
      evidence: Run the environment check and submit its successful summary.
    python:
      expected_minutes: 90
      evidence: Complete the Python functions and collections practice set.
    arrays:
      expected_minutes: 90
      evidence: Complete the shapes, masks, broadcasting, and reductions practice set.
    tables:
      expected_minutes: 120
      evidence: Complete the selection, grouping, and tidy-table practice set.
    mathematics:
      expected_minutes: 60
      evidence: Complete the notation, logarithm, vector, and mean/variance practice set.
  escalation:
    trigger: Any route still below its minimum after remediation
    action: Meet the instructor or teaching assistant before Block 3 for a supported plan.

