priority_definitions:
  P0:
    label: Essential
    contract: Taught explicitly, practised repeatedly, assessed individually, final-exam eligible.
  P1:
    label: Core
    contract: Taught and practised, assessed at least once, eligible for announced assessments.
  P2:
    label: Extension
    contract: Optional or selected bridge/project material; never an unannounced prerequisite.
  P3:
    label: Deferred
    contract: Outside the 28-hour contract and transferred to another course or archive.

difficulty_definitions:
  D1: Guided
  D2: Independent
  D3: Synthesis

learning_outcomes:
  - id: LO1
    statement: Formulate a data question and identify the unit of analysis, target, stakeholders, assumptions, and risks.
    priority: P0
  - id: LO2
    statement: Document and audit provenance, licence, privacy, schema, types, units, missingness, duplicates, anomalies, and representativeness.
    priority: P0
  - id: LO3
    statement: Combine and transform tabular data with validated joins, reshaping, grouping, and executable quality checks.
    priority: P0
  - id: LO4
    statement: Produce reproducible exploratory analysis and truthful visualisations.
    priority: P0
  - id: LO5
    statement: Construct leakage-safe preprocessing and evaluation pipelines for heterogeneous features.
    priority: P0
  - id: LO6
    statement: Select and interpret baselines, splits, cross-validation, metrics, thresholds, uncertainty, and failure analyses.
    priority: P0
  - id: LO7
    statement: Explain and apply the core supervised and unsupervised methods in the course priority map.
    priority: P1
  - id: LO8
    statement: Reason about complexity, memory, dtypes, columnar storage, and query-before-materialisation workflows.
    priority: P1
  - id: LO9
    statement: Test transformations and metrics with toy oracles and execute the analysis from a clean checkout.
    priority: P0
  - id: LO10
    statement: Write dataset and result documentation, limitations, and an AI-assistance declaration.
    priority: P0
  - id: LO11
    statement: Explain how vectorised data workflows connect to downstream JAX, SciML, and HPC topics.
    priority: P2

course_boundaries:
  owns:
    - Data provenance, quality, schemas, wrangling, and exploratory analysis
    - Leakage-safe preprocessing and evaluation
    - Statistical-learning foundations and tabular baselines
    - PCA, clustering, and cluster validation
    - Performance-aware single-node data processing
    - Reproducibility, testing, dataset/result documentation, and responsible data use
  applies_from_other_courses:
    project_1:
      - Git and GitHub
      - Continuous integration
      - Containers and project management
    database:
      - Relational design and SQL foundations
    random_models:
      - Probability and stochastic-process foundations
    scientific_computing_optimisation:
      - Numerical methods and optimisation foundations
  defers:
    scientific_machine_learning_1:
      - Detailed JAX model construction
      - PyTrees and Optax training architectures
