schema_version: 2
decision_version: "2026-09-05-teaching-progression"

course:
  id: course-data
  title: Data Processing and Mining
  programme: CSMI
  level: M1
  semester: S1
  ects: 3
  contact_hours: 28
  delivery_blocks: 14
  block_duration_hours: 2
  site_language: en
  student_facing_language: en
  primary_runtime:
    python: "3.12"
    os: Ubuntu 24.04 LTS
    accelerator_required: false

execution_contract:
  reference_environment:
    cpu_cores: 2
    memory_gib: 8
    architecture: x86_64
    network_during_assessment: false
    accelerator_required: false
  limits:
    fast_ci_minutes: 5
    full_ci_minutes: 30
    student_notebook_minutes: 10
    final_reference_minutes: 15
    final_student_compute_minutes: 8
    peak_memory_gib: 4
  tolerances:
    deterministic_counts: exact
    deterministic_float:
      relative: 1.0e-7
      absolute: 1.0e-10
    seeded_metric_absolute: 0.01
    stochastic_metric_absolute: 0.02
  grading_rules:
    - Wall-clock speed is never graded.
    - Fixed data and iteration budgets replace timing competitions.
    - A tolerance must be justified by numerical scale or controlled stochastic variation.
    - CPU correctness is the baseline; accelerator use is optional.

