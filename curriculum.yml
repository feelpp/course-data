    - notebooks/instructor/extensions/jax-transformations.ipynb
  source_contract:
    asciidoc_notebook:
      - docs/course/modules/ROOT/pages/extensions/kernel-methods.adoc
      - docs/course/modules/ROOT/pages/extensions/probability-calibration.adoc
      - docs/course/modules/ROOT/pages/extensions/experiment-tracking.adoc
      - docs/course/modules/ROOT/pages/extensions/drift-monitoring.adoc
    notebook_native_exceptions:
      - id: EXT-JAX-NB
        page: docs/course/modules/ROOT/pages/extensions/jax-transformations.adoc
        artifact: notebooks/instructor/extensions/jax-transformations.ipynb
        reason: Optional JAX execution and retained student/instructor cell transformations must not become dependencies of the required Antora build.
        owner: Data Processing maintainer with the Scientific Machine Learning 1 liaison
        environment: Locked extensions extra on CPython 3.12 with the CPU backend and no accelerator
        maintenance_policy: Execute the full profile and compare page, instructor, and solution-free student variants after JAX or converter changes.
        page_authority: Canonical English learning narrative, mathematics, environment boundary, and transfer task
        artifact_authority: Canonical executable JAX lab, solution tags, and student-source transformations
        parity_contract: Concepts, outcomes, priority, duration, prerequisites, numerical method, and exclusions must agree.
    page_only_exceptions:
      - id: EXT-ENG-PAGE
        page: docs/course/modules/ROOT/pages/extensions/dataframe-engines.adoc
        reason: A fair three-engine comparison requires optional Polars and machine-specific timing and memory evidence that must not be presented as a portable build result.
        owner: Data Processing maintainer with the Database and High Performance Computing liaisons
        environment: Core CPU environment for pandas and DuckDB; locked extensions extra for Polars
        maintenance_policy: Re-run the declared protocol on a named reference machine after engine, Arrow, or Parquet updates and keep timings out of P0/P1 claims.
      - id: EXT-PATH-PAGE
        page: docs/course/modules/ROOT/pages/extensions/downstream-paths.adoc
        reason: The learning object is a programme ownership and prerequisite map with no executable method or result.
        owner: Data Processing maintainer with the Scientific Machine Learning 1, High Performance Computing, Database, and Project owners
        environment: English Antora page with no Python runtime
        maintenance_policy: Review the ownership map against the CSMI programme and named downstream owners before each annual release.
  optional_failure_policy:
    required_notebook_profile: fast
    extension_notebook_profile: full
    required_environment_excludes_optional_extra: true
    optional_runtime_imports_forbidden_in_p0_p1: [jax, polars]
  dependency_extra: extensions
  pinned_optional_dependencies:
    jax: "0.10.2"
    polars: "1.42.1"
  validation_record: docs/governance/enrichment-validation.md
  source_contract_record: docs/governance/optional-extension-contract.md
  review_record: docs/reviews/20260724_optional-extension-review.md
  downstream_record: docs/governance/sciml-handoff.md
  downstream_owners:
    - Scientific Machine Learning 1
    - High Performance Computing
    - Database
    - Project
  explicitly_deferred:
    - PyTrees and Optax training architectures
    - Neural-network implementation mastery
    - Large sentiment and MNIST training studies
    - Deep architecture surveys
    - Distributed and multi-device execution
    - Full deployment orchestration

