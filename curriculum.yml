teaching_allocation:
  page_duration_policy: Page durations cover the complete reference/practice route; contact_plan is the authoritative classroom allocation.
  preparation_minutes_total: 325
  individual_verification: Separate appointment outside the fourteen contact blocks; 5–8 minutes per student plus transitions.
  optional_contact_minutes: 0
learning_activities:
  - id: E01
    title: Reproducible first data audit
    type: diagnostic_and_guided_lab
    duration_minutes: 40
    concepts: [DP-FND-01, DP-FND-02, DP-GOV-01, DP-REP-01, DP-ARR-01]
    outcomes: [LO1, LO2, LO3, LO8, LO9, LO10]
    datasets: [uci-501]
    deliverable: Data question, source record, and first audit; environment diagnostic after class
    acceptance_criteria: [The documented command succeeds from a clean checkout., 'The source, licence, unit of analysis, and three quality risks are stated.']
  - id: E02
    title: Tidy sensor observations
    type: guided_lab_and_transfer_task
    duration_minutes: 65
    concepts: [DP-TAB-01, DP-TAB-02, DP-QLT-01]
    outcomes: [LO2, LO3]
    datasets: [uci-501]
    deliverable: Typed tidy table and grouped summary with assertions
    acceptance_criteria: ['Types, units, timestamp, and category semantics are explicit.', Reshaping and aggregation preserve the stated unit of analysis.]
  - id: E03
    title: Validate a multi-table quality repair
    type: guided_lab_and_independent_exercise
    duration_minutes: 70
    concepts: [DP-TAB-03, DP-QLT-02, DP-QLT-03, DP-QLT-04]
    outcomes: [LO2, LO3, LO4, LO5, LO9]
    datasets: [uci-501]
    deliverable: Join report, quality decisions, and executable data contract
    acceptance_criteria: [Join cardinality and row preservation are tested., 'Missing, duplicate, invalid, and anomalous values receive distinct justified treatment.']
  - id: E04
    title: Evidence-based exploratory brief
    type: independent_analysis
    duration_minutes: 65
    concepts: [DP-EDA-01, DP-SMP-01]
    outcomes: [LO1, LO2, LO4, LO6]
    datasets: [uci-501]
    deliverable: One-page brief with three labelled figures and a representativeness warning
    acceptance_criteria: [Each figure answers a stated question without hiding missingness or scale., 'Population, sample, selection limits, and unsupported generalisations are explicit.']
  - id: E05
    title: Repair a leaking baseline
    type: guided_lab_and_code_review
    duration_minutes: 75
    concepts: [DP-EVAL-01, DP-EVAL-02, DP-PIPE-01, DP-EVAL-03]
    outcomes: [LO5, LO6, LO9]
    datasets: [uci-501, uci-601]
    deliverable: Leakage-safe mixed-feature pipeline and dummy comparison
    acceptance_criteria: [The final test set influences no learned transform or selection decision., Group or temporal structure is respected and the baseline is interpreted.]
  - id: E06
    title: Stable least-squares investigation
    type: mathematical_lab
    duration_minutes: 70
    concepts: [DP-LIN-01, DP-PROB-01, DP-NUM-01, DP-MET-01]
    outcomes: [LO6, LO7, LO8]
    datasets: [synthetic-oracles, uci-501]
    deliverable: Solver comparison, residual diagnosis, and likelihood explanation
    acceptance_criteria: [Stable solvers are compared without explicit matrix inversion in production code., 'Conditioning, residuals, MAE or RMSE, and assumptions are interpreted.']
  - id: E07
    title: Cost-aware classification decisions
    type: guided_lab_and_scenario_task
    duration_minutes: 70
    concepts: [DP-CLS-01, DP-MET-02, DP-THR-01]
    outcomes: [LO6, LO7]
    datasets: [uci-601]
    deliverable: Stable classifier, metric table, threshold choice, and failure analysis
    acceptance_criteria: [Leakage-prone target relatives are excluded from predictors., Metric and threshold choices follow from prevalence and stated error costs.]
  - id: E08
    title: Regularisation and generalisation study
    type: controlled_experiment
    duration_minutes: 50
    concepts: [DP-REG-01, DP-GEN-01, DP-CV-01, DP-SEARCH-01, DP-FEAT-01]
    outcomes: [LO5, LO6, LO7]
    datasets: [synthetic-oracles]
    deliverable: Full-pipeline search and controlled generalisation evidence
    acceptance_criteria: [Tuning occurs inside appropriate cross-validation while the test set remains untouched., The bias-variance diagnosis is supported by controlled evidence.]
  - id: E09
    title: Tree ensemble comparison
    type: guided_lab_and_transfer_task
    duration_minutes: 70
    concepts: [DP-TREE-01, DP-ENS-01, DP-ENS-02, DP-INT-01]
    outcomes: [LO6, LO7, LO10]
    datasets: [uci-601]
    deliverable: Baseline, tree, forest, and boosting comparison with interpretation limits
    acceptance_criteria: [Complexity controls and validation are reported for every model., Predictive importance is not presented as a causal effect.]
  - id: E10
    title: Unsupervised structure under challenge
    type: guided_lab_and_independent_exercise
    duration_minutes: 75
    concepts: [DP-PCA-01, DP-CLU-01, DP-CLU-02, DP-CLU-03]
    outcomes: [LO6, LO7, LO8]
    datasets: [uci-501, uci-602, synthetic-oracles]
    deliverable: PCA and clustering comparison with stability and domain validation
    acceptance_criteria: [Scaling and dimensionality choices are fitted without evaluation leakage., 'Clusters are challenged across seeds, samples, or algorithms and are not called true labels.']
  - id: E11
    title: Measured columnar data workflow
    type: performance_lab
    duration_minutes: 65
    concepts: [DP-PERF-01, DP-FMT-01, DP-SQL-01]
    outcomes: [LO8]
    datasets: [uci-501]
    deliverable: Reproducible CSV, Parquet, and query-before-materialisation comparison
    acceptance_criteria: ['Runtime, memory, storage size, and selected columns or rows are measured fairly.', The conclusion distinguishes algorithmic improvement from engine-specific effects.]
  - id: E12
    title: Reproducibility and responsibility audit
    type: distributed_documentation_and_test_practice
    duration_minutes: 65
    concepts: [DP-TST-01, DP-DOC-01, DP-AI-01, DP-GOV-01]
    outcomes: [LO2, LO9, LO10]
    datasets: [uci-501, uci-601]
    deliverable: Datasheet, result card, AI declaration, tests, and rerun manifest
    acceptance_criteria: [Toy-oracle and smoke tests pass from a clean environment., 'Provenance, permitted use, limitations, and assistance are traceable.']
  - id: E13
    title: Integrated project review
    type: synthesis_clinic
    duration_minutes: 80
    concepts: [DP-FEAT-01, DP-SEARCH-01, DP-REP-01, DP-TST-01]
    outcomes: [LO5, LO6, LO7, LO9]
    datasets: [uci-501, uci-601, uci-602]
    deliverable: Reviewable project pull request and draft result card
    acceptance_criteria: [Feature and model selection are nested inside the validation design., 'CI, tests, environment lock, data identifiers, and result claims agree.']
  - id: E14
    title: Professional audit within Control 2
    type: individual_control_audit
    duration_minutes: 55
    concepts: [DP-EVAL-02, DP-INT-01]
    outcomes: [LO5, LO6, LO10]
    datasets: [synthetic-oracles]
    deliverable: Prioritised defect report, correct repairs, and course synthesis
    acceptance_criteria: [Critical validity defects are identified before presentation defects., 'Repairs are specific, reproducible, and proportionate to the consequence.']
