schedule:
  - block: 1
    title: Course contract, data lifecycle, diagnostic, and reproducible repository
    concepts: [DP-FND-01, DP-FND-02, DP-GOV-01, DP-REP-01, DP-ARR-01]
    checkpoint: Environment check, diagnostic, and source/licence record
  - block: 2
    title: DataFrames, types, units, tidy data, reshape, and grouping
    concepts: [DP-TAB-01, DP-TAB-02, DP-QLT-01]
    checkpoint: Clean transformation notebook with assertions
  - block: 3
    title: Joins, schemas, missing values, duplicates, and anomalies
    concepts: [DP-TAB-03, DP-QLT-02, DP-QLT-03, DP-QLT-04]
    checkpoint: Data-quality report and tests
  - block: 4
    title: EDA, sampling, representativeness, and visual communication
    concepts: [DP-EDA-01, DP-SMP-01]
    checkpoint: One-page evidence-based EDA brief
  - block: 5
    title: Splits, leakage, preprocessing pipelines, and baselines
    concepts: [DP-EVAL-01, DP-EVAL-02, DP-PIPE-01, DP-EVAL-03]
    checkpoint: Leakage-safe mixed-feature pipeline
  - block: 6
    title: Regression, stable least squares, likelihood, and residuals
    concepts: [DP-LIN-01, DP-PROB-01, DP-NUM-01, DP-MET-01]
    checkpoint: Solver and conditioning experiment
  - block: 7
    title: Logistic and softmax models, losses, metrics, and thresholds
    concepts: [DP-CLS-01, DP-MET-02, DP-THR-01]
    checkpoint: Metric and threshold justified from consequences
  - block: 8
    title: Ridge, Lasso, bias-variance, cross-validation, and Control 1
    concepts: [DP-REG-01, DP-GEN-01, DP-CV-01]
    checkpoint: A1 Control 1
  - block: 9
    title: Trees, random forests, boosting, and interpretation limits
    concepts: [DP-TREE-01, DP-ENS-01, DP-ENS-02, DP-INT-01]
    checkpoint: Model comparison and error analysis
  - block: 10
    title: PCA, k-means, hierarchical clustering, DBSCAN, and validation
    concepts: [DP-PCA-01, DP-CLU-01, DP-CLU-02, DP-CLU-03]
    checkpoint: Unsupervised analysis with stability caveat
  - block: 11
    title: Vectorisation, memory, Parquet, Arrow, and query pushdown
    concepts: [DP-PERF-01, DP-FMT-01, DP-SQL-01]
    checkpoint: Runtime, memory, and storage comparison
  - block: 12
    title: Testing, FAIR documentation, privacy, responsible AI, and failure analysis
    concepts: [DP-TST-01, DP-DOC-01, DP-AI-01, DP-GOV-01]
    checkpoint: Datasheet, result card, AI log, and reproducibility manifest
  - block: 13
    title: Integrated mini-project clinic
    concepts: [DP-FEAT-01, DP-SEARCH-01, DP-REP-01, DP-TST-01]
    checkpoint: A2 project pull request and draft result card
  - block: 14
    title: Audit, individual verification, synthesis, and optional JAX bridge demonstration
    concepts: [DP-EVAL-02, DP-INT-01, DP-JAX-01, DP-JAX-02, DP-JAX-03]
    checkpoint: A3 Control 2 and course synthesis
