[project]
name = "csmi-course-data-tools"
version = "0.1.0"
description = "Build and validation tools for the CSMI Data Processing course"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel==6.30.1",
  "nbclient==0.10.2",
  "nbformat==5.10.4",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.4",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["archive", "build", "public"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
