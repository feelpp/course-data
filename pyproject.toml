[project]
name = "csmi-course-data-tools"
version = "0.1.0"
description = "Build and validation tools for the CSMI Data Processing course"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==1.5.4",
  "duckdb>=1.5.4",
  "ipykernel==6.30.1",
  "matplotlib==3.11.1",
  "nbclient==0.10.2",
  "nbformat==5.10.4",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "pyarrow==25.0.0",
  "pyarrow>=25.0.0",
  "pyyaml==6.0.2",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.4",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["archive", "build", "public"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/build_foundation_notebooks.py" = ["E501"]
"tools/build_analytical_notebooks.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
