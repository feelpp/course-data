[project]
name = "csmi-data-mini-project"
version = "0.1.0"
description = "Student mini-project in CSMI Data Processing and Mining"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==1.5.4",
  "ipykernel==6.30.1",
  "matplotlib==3.11.1",
  "nbclient==0.10.2",
  "nbformat==5.10.4",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "pyarrow==25.0.0",
  "pyyaml==6.0.2",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
]

[project.optional-dependencies]
extensions = [
  "jax==0.10.2",
  "polars==1.42.1",
]

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "pytest==8.4.1",
  "ruff==0.12.4",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["archive", "build", "public"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/build_jax_notebook.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
