name: Publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: pages
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --locked --all-groups
      - run: npm ci
      - run: npm run audit
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Report redacted Pages validation details
        shell: python {0}
        run: |
          import os
          from pathlib import Path

          action = (Path(os.environ["RUNNER_WORKSPACE"]).parent / "_actions" /
                    "actions/deploy-pages/cd2ce8fcbc39b97be8ca5fce6e763baed58fa128/dist/index.js")
          source = action.read_text()
          original = "core.error('Creating Pages deployment failed', error)"
          redacted = ("JSON.stringify(error.response?.data ?? {})"
                      ".replaceAll(idToken, '[redacted OIDC]')"
                      ".replaceAll(githubToken, '[redacted token]')")
          diagnostic = "core.error('Pages validation response: ' + " + redacted + ");\n    "
          if source.count(original) != 1:
              raise RuntimeError("Pinned Pages diagnostic insertion point changed")
          action.write_text(source.replace(original, diagnostic + original))
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
