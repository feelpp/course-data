name: Build course release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run release:qualify
      - name: Package the generated site
        run: |
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner -czf build/release/course-data-site.tar.gz -C public .
          sha256sum build/release/course-data-student-bundle.zip build/release/course-data-site.tar.gz build/release/reproducibility-report.json > build/release/release-checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: course-release-${{ github.ref_name }}
          path: |
            build/release/course-data-student-bundle.zip
            build/release/course-data-student-bundle.zip.sha256
            build/release/course-data-site.tar.gz
            build/release/reproducibility-report.json
            build/release/release-checksums.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: course-release-${{ github.ref_name }}
          path: build/release
      - name: Publish immutable tagged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release/course-data-student-bundle.zip \
            build/release/course-data-student-bundle.zip.sha256 \
            build/release/course-data-site.tar.gz \
            build/release/reproducibility-report.json \
            build/release/release-checksums.txt \
            --verify-tag --generate-notes --title "CSMI Data Processing and Mining $GITHUB_REF_NAME"
